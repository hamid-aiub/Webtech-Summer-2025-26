<html>
  <head>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <h1>Event Registration Form</h1>
    <table>
      <tr>
        <td>Name</td>
        <td><input type="text" placeholder="Enter your name" /></td>
      </tr>

      <tr>
        <td>Email</td>
        <td><input type="text" placeholder="Enter your email" /></td>
      </tr>
      <tr>
        <td>Password</td>
        <td><input type="password" placeholder="Enter your password" /></td>
      </tr>
      <tr>
        <td>Age</td>
        <td><input type="number" placeholder="Enter your age" /></td>
      </tr>
      <tr>
        <td>DOB</td>
        <td><input type="date" placeholder="Enter your age" /></td>
      </tr>
      <tr>
        <td>Gender</td>
        <td>
          <input type="radio" id="gender" value="male" name="gender" /> Male
          <input type="radio" id="gender" value="female" name="gender" /> Female
        </td>
      </tr>
      <tr>
        <td></td>
        <td><button>Sign Up</button></td>
      </tr>
    </table>
  </body>
</html>
